services:
  node1:
    build: ./ClockNode
    environment:
      INITIAL_OFFSET_MS: "5000"
      RESPONSE_DELAY_MS: "0"
    ports:
      - "8081:8080"
    networks:
      - clocks

  node2:
    build: ./ClockNode
    environment:
      INITIAL_OFFSET_MS: "10000"
      RESPONSE_DELAY_MS: "0"
    ports:
      - "8082:8080"
    networks:
      - clocks

  node3:
    build: ./ClockNode
    environment:
      INITIAL_OFFSET_MS: "-20000"
      RESPONSE_DELAY_MS: "0"
    ports:
      - "8083:8080"
    networks:
      - clocks

  coordinator:
    build: ./BerkeleyCoordinator
    environment:
      NODES: "http://node1:8080,http://node2:8080,http://node3:8080"
      INITIAL_OFFSET_MS: "0"
      SYNC_INTERVAL_SECONDS: "15"
      OUTLIER_THRESHOLD_MS: "60000"
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - clocks

networks:
  clocks:
    driver: bridge