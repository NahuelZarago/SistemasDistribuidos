services:
  inventory-service:
    build: ./InventoryService
    ports: ["8082:8080"]
    networks: [lamport-net]
  payments-service:
    build: ./PaymentsService
    ports: ["8083:8080"]
    networks: [lamport-net]
  orders-service:
    build: ./OrdersService
    ports: ["8081:8080"]
    environment:
      InventoryUrl: http://inventory-service:8080
      PaymentsUrl: http://payments-service:8080
    networks: [lamport-net]
networks:
  lamport-net:
    driver: bridge